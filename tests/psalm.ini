; Minimal php.ini for running psalm.phar locally (see AGENTS.md "PHP Compatibility").
;
; Needed because this machine's PHPRC always points at PHP-8.4's own php.ini
; regardless of which php.exe actually runs — and that ini fails to load
; openssl/mbstring/curl for a Windows CLI SAPI invoked with -n and only -d
; flags (the same flags, pointed at a real ini file via -c, load fine).
; psalm.phar's bundled Box "Requirements Checker" hard-fails without openssl,
; so this file exists purely to give it a clean environment to check against.
extension_dir = "C:/osp6/modules/PHP-8.4/ext"
extension = openssl
extension = mbstring
extension = curl
extension = mysqli
extension = pdo_mysql
memory_limit = -1
