<div class="auth-field">
    <label>{_wp('Login')|escape}</label>
    <input type="text" name="login" autocomplete="username" autofocus>
</div>
<div class="auth-field">
    <label>{_wp('Password')|escape}</label>
    <input type="password" name="password" autocomplete="current-password">
</div>
{if $rememberme}
    <div class="auth-field">
        <label><input type="checkbox" name="rememberme" value="1"> {_wp('Remember me')|escape}</label>
    </div>
{/if}
